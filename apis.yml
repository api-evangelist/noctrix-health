apis:
- name: Nidra MCP Server
  description: >-
    A live Model Context Protocol server operated by Noctrix Health on the Nidra product
    site. Discovered anonymously from RFC 9728 OAuth 2.0 Protected Resource Metadata at
    https://nidrarls.com/.well-known/oauth-protected-resource, which names this endpoint
    as the protected resource. It answers POST, GET and DELETE and is OAuth 2.0 gated —
    an anonymous tools/list returns HTTP 401 with a correct RFC 9728 WWW-Authenticate
    challenge — so the tool set and its input schemas are not publicly enumerable. This is
    the only machine-readable API surface Noctrix Health publishes; there is no OpenAPI,
    GraphQL, AsyncAPI or agent card on any host it operates.
  humanURL: https://nidrarls.com/
  baseURL: https://nidrarls.com/wp-json/mcp/mcp-oauth-server
