aid: noctrix-health
name: Noctrix Health
description: >-
  Noctrix Health, Inc. is a Pleasanton, California medical device company that develops
  drug-free wearable neurostimulation therapies for chronic neurological conditions. Its
  product is the Nidra Tonic Motor Activation (TOMAC) System, a prescription pair of
  lower-leg devices that stimulate the peroneal nerves to suppress the symptoms of
  medication-refractory moderate-to-severe Restless Legs Syndrome and improve sleep
  quality; the NTX100 received FDA De Novo marketing authorization in April 2023 after a
  2020 Breakthrough Device Designation. Noctrix was acquired by Resmed and became a wholly
  owned subsidiary on 1 June 2026. The company runs no developer program and publishes no
  OpenAPI, SDK or API reference, but the Nidra product site is deliberately agent-ready:
  it serves a hand-authored llms.txt with markdown twins of every key page, opts AI
  crawlers in via robots.txt, and runs a live OAuth-protected Model Context Protocol
  server discoverable through RFC 8414 and RFC 9728 well-known metadata.
